spring.application.name=ghostprofiler-demo-app
server.port=8080

# H2 in-memory datasource — no external DB required
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 web console — accessible at http://localhost:8080/h2-console during development
spring.h2.console.enabled=true
