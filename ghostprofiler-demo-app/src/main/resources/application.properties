# ── GhostProfiler Demo App Configuration ──────────────────────────────────────
spring.application.name=ghostprofiler-demo-app

# H2 in-memory database — no external DB needed
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Load seed data from data.sql after schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 console for debugging (access: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server port for the demo app (agent HTTP server defaults to 9090)
server.port=8080

# Logging
logging.level.com.ghostprofiler=INFO
